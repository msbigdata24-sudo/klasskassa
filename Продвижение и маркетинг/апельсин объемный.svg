<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main gradient -->
    <radialGradient id="mainGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFB37A"></stop>
      <stop offset="60%" stop-color="#FF8C42"></stop>
      <stop offset="100%" stop-color="#E65C1E"></stop>
    </radialGradient>

    <!-- Inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </radialGradient>

    <!-- Glass highlight -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"></stop>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#E65C1E" flood-opacity="0.35"></feDropShadow>
    </filter>
  </defs>

  <!-- Base circle with shadow -->
  <circle cx="128" cy="128" r="110" fill="url(#mainGrad)" filter="url(#shadow)"></circle>

  <!-- Soft inner glow -->
  <circle cx="128" cy="128" r="90" fill="url(#innerGlow)"></circle>

  <!-- Slice separators (soft, inset style) -->
  <g stroke="#FFF7ED" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <line x1="128" y1="28" x2="128" y2="228"></line>
    <line x1="28" y1="128" x2="228" y2="128"></line>
  </g>

  <!-- Center highlight -->
  <circle cx="128" cy="128" r="8" fill="#FFF7ED" opacity="0.9"></circle>

  <!-- Glass reflection -->
  <ellipse cx="95" cy="85" rx="55" ry="30" fill="url(#glass)" transform="rotate(-20 95 85)"></ellipse>

</svg>